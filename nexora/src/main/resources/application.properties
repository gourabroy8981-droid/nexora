# ===============================
# SERVER CONFIG
# ===============================
server.port=8080


# ===============================
# DATABASE CONFIG (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/nexora?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Gourab@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ? ADD THIS (shows actual values in queries)
spring.jpa.properties.hibernate.type.descriptor.sql.BasicBinder.log=true


# ===============================
# JWT CONFIG
# ===============================
jwt.secret=MySuperSecretKeyForNexoraProject
jwt.expiration=86400000


# ===============================
# LOGGING (DB + DEBUG)
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ? ADD THIS (important for JPA errors)
logging.level.org.springframework.orm.jpa=DEBUG


# ===============================
# WEBSOCKET DEBUG (CRITICAL)
# ===============================
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG

# ? ADD THIS (VERY IMPORTANT for STOMP routing)
logging.level.org.springframework.messaging.simp=DEBUG
logging.level.org.springframework.messaging.simp.stomp=DEBUG


# ===============================
# SPRING SECURITY DEBUG (FINAL)
# ===============================
logging.level.org.springframework.security=DEBUG